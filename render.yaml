services:
  - type: web
    name: dypstore
    env: dotnet
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/DYPStore.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://+:8080
    healthCheckPath: /
